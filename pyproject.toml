[project]
name = "dfe-copilot"
version = "0.1.0"
description = "DF-e Copilot: diagnostico de incidentes de documentos fiscais eletronicos (NF-e) sobre o core do IIC"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# Shared core is consumed by immutable release URL, without workspace sources.
dependencies = ["copilot-core==1.5.0", "lxml>=6.1", "pydantic>=2.13", "torch>=2.14.1"]

[tool.uv.sources]
copilot-core = { url = "https://github.com/marcos-slima/copilot-platform/releases/download/core%2Fv1.5.0/copilot_core-1.5.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"data/schemas" = "dfe_copilot/_data/schemas"
"data/corpus/manifest.json" = "dfe_copilot/_data/corpus/manifest.json"
"data/corpus/cstat_moc7_anexo_i.json" = "dfe_copilot/_data/corpus/cstat_moc7_anexo_i.json"
"data/corpus/regra_2B08-20.md" = "dfe_copilot/_data/corpus/regra_2B08-20.md"
"data/corpus/NT_2018.005_v1.51.pdf" = "dfe_copilot/_data/corpus/NT_2018.005_v1.51.pdf"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
# Product tests use installed core and product wheels in CI.
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov>=6", "ruff==0.16.1"]

[tool.ruff]
line-length = 100
